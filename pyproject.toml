[project]
name = "chitramaya"
version = "0.1.0"
description = "Agent-native image and video generation engine on AMD MI300X GPUs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7",
    "websockets>=16.0",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
